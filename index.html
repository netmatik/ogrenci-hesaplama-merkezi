<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NetMatik | YKS Hesaplama Merkezi</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

header{
    background:#3157d5;
    color:white;
    text-align:center;
    padding:30px 15px;
}

header h1{
    font-size:36px;
    margin-bottom:8px;
}

.container{
    max-width:950px;
    margin:auto;
    padding:20px;
}

.section{
    background:white;
    padding:22px;
    border-radius:18px;
    margin-bottom:22px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.section h2{
    color:#3157d5;
    margin-bottom:18px;
}

.subject{
    display:grid;
    grid-template-columns:1fr 80px 80px 80px;
    gap:10px;
    align-items:center;
    margin-bottom:12px;
}

.subject input{
    width:100%;
    padding:9px 4px;
    border:1px solid #ddd;
    border-radius:8px;
    text-align:center;
}

.net{
    text-align:center;
    font-weight:bold;
    color:#3157d5;
}

.info input,
.search{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
    margin-top:8px;
}

button{
    width:100%;
    background:#3157d5;
    color:white;
    border:0;
    padding:15px;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin:10px 0;
}

.hata{
    display:none;
    background:#ffe5e5;
    color:#b00020;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
}

.result{
    display:none;
    background:#eaf0ff;
    padding:22px;
    border-radius:18px;
    margin-bottom:25px;
}

.kart{
    background:white;
    padding:18px;
    border-radius:14px;
    margin:12px 0;
    border-left:5px solid #3157d5;
}

.kart h3{
    margin-bottom:8px;
}

.kart p{
    margin:6px 0;
}

@media(max-width:650px){
    .subject{
        grid-template-columns:1fr 60px 60px 60px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎓 NetMatik</h1>
    <p>YKS Net ve Üniversite Hesaplama Merkezi</p>
</header>

<div class="container">

<div class="section">

<h2>👤 OBP</h2>

<input
    type="number"
    id="obp"
    min="0"
    max="500"
    placeholder="OBP'nizi girin (0-500)"
>

</div>

<div id="hata" class="hata"></div>

<div class="section">

<h2>🎯 TYT</h2>

<div class="subject">
<strong>Ders</strong>
<strong>Doğru</strong>
<strong>Yanlış</strong>
<strong>Net</strong>
</div>

<div class="subject">
<span>Türkçe</span>
<input id="tytTurkceD" type="number" min="0" max="40">
<input id="tytTurkceY" type="number" min="0" max="40">
<span class="net" id="tytTurkceN">0</span>
</div>

<div class="subject">
<span>Matematik</span>
<input id="tytMatD" type="number" min="0" max="40">
<input id="tytMatY" type="number" min="0" max="40">
<span class="net" id="tytMatN">0</span>
</div>

<div class="subject">
<span>Sosyal</span>
<input id="tytSosyalD" type="number" min="0" max="20">
<input id="tytSosyalY" type="number" min="0" max="20">
<span class="net" id="tytSosyalN">0</span>
</div>

<div class="subject">
<span>Fen</span>
<input id="tytFenD" type="number" min="0" max="20">
<input id="tytFenY" type="number" min="0" max="20">
<span class="net" id="tytFenN">0</span>
</div>

</div>

<div class="section">

<h2>🔢 AYT Sayısal</h2>

<div class="subject">
<span>Matematik</span>
<input id="aytMatD" type="number" min="0" max="40">
<input id="aytMatY" type="number" min="0" max="40">
<span class="net" id="aytMatN">0</span>
</div>

<div class="subject">
<span>Fen</span>
<input id="aytFenD" type="number" min="0" max="40">
<input id="aytFenY" type="number" min="0" max="40">
<span class="net" id="aytFenN">0</span>
</div>

</div>

<div class="section">

<h2>📚 AYT EA / Sözel</h2>

<div class="subject">
<span>Edebiyat</span>
<input id="aytEdebD" type="number" min="0" max="24">
<input id="aytEdebY" type="number" min="0" max="24">
<span class="net" id="aytEdebN">0</span>
</div>

<div class="subject">
<span>Tarih-1</span>
<input id="aytTarih1D" type="number" min="0" max="10">
<input id="aytTarih1Y" type="number" min="0" max="10">
<span class="net" id="aytTarih1N">0</span>
</div>

<div class="subject">
<span>Coğrafya-1</span>
<input id="aytCografya1D" type="number" min="0" max="6">
<input id="aytCografya1Y" type="number" min="0" max="6">
<span class="net" id="aytCografya1N">0</span>
</div>

</div>

<button onclick="hesapla()">
🧮 NETLERİ HESAPLA
</button>

<div id="sonuc" class="result">

<h2>🎉 Sonuçların</h2>

<p id="tytSonuc"></p>
<p id="saySonuc"></p>
<p id="eaSonuc"></p>

</div>

<div class="section">

<h2>🎓 Üniversite / Bölüm Ara</h2>

<input
    class="search"
    id="arama"
    placeholder="Bölüm veya üniversite yaz..."
>

<button onclick="ara()">
🔎 UYGUN PROGRAMLARI GÖSTER
</button>

<div id="programListesi"></div>

</div>

</div>

<script src="universiteler.js"></script>

<script>

function say(id){
    return Number(document.getElementById(id).value) || 0;
}

function net(d,y){
    return d-(y/4);
}

function kontrol(){

    const dersler=[
        ["tytTurkceD","tytTurkceY",40,"TYT Türkçe"],
        ["tytMatD","tytMatY",40,"TYT Matematik"],
        ["tytSosyalD","tytSosyalY",20,"TYT Sosyal"],
        ["tytFenD","tytFenY",20,"TYT Fen"],
        ["aytMatD","aytMatY",40,"AYT Matematik"],
        ["aytFenD","aytFenY",40,"AYT Fen"],
        ["aytEdebD","aytEdebY",24,"AYT Edebiyat"],
        ["aytTarih1D","aytTarih1Y",10,"AYT Tarih-1"],
        ["aytCografya1D","aytCografya1Y",6,"AYT Coğrafya-1"]
    ];

    for(const d of dersler){

        const dogru=say(d[0]);
        const yanlis=say(d[1]);

        if(dogru+yanlis>d[2]){

            const hata=document.getElementById("hata");

            hata.innerText=
            "❌ "+d[3]+" için doğru + yanlış "+d[2]+" soruyu geçemez.";

            hata.style.display="block";

            return false;
        }
    }

    document.getElementById("hata").style.display="none";

    return true;
}

function hesapla(){

    if(!kontrol()) return;

    const tyt=
        net(say("tytTurkceD"),say("tytTurkceY"))+
        net(say("tytMatD"),say("tytMatY"))+
        net(say("tytSosyalD"),say("tytSosyalY"))+
        net(say("tytFenD"),say("tytFenY"));

    const sayisal=
        net(say("aytMatD"),say("aytMatY"))+
        net(say("aytFenD"),say("aytFenY"));

    const ea=
        net(say("aytEdebD"),say("aytEdebY"))+
        net(say("aytTarih1D"),say("aytTarih1Y"))+
        net(say("aytCografya1D"),say("aytCografya1Y"));

    document.getElementById("tytTurkceN").innerText=
        net(say("tytTurkceD"),say("tytTurkceY")).toFixed(2);

    document.getElementById("tytMatN").innerText=
        net(say("tytMatD"),say("tytMatY")).toFixed(2);

    document.getElementById("tytSosyalN").innerText=
        net(say("tytSosyalD"),say("tytSosyalY")).toFixed(2);

    document.getElementById("tytFenN").innerText=
        net(say("tytFenD"),say("tytFenY")).toFixed(2);

    document.getElementById("aytMatN").innerText=
        net(say("aytMatD"),say("aytMatY")).toFixed(2);

    document.getElementById("aytFenN").innerText=
        net(say("aytFenD"),say("aytFenY")).toFixed(2);

    document.getElementById("aytEdebN").innerText=
        net(say("aytEdebD"),say("aytEdebY")).toFixed(2);

    document.getElementById("aytTarih1N").innerText=
        net(say("aytTarih1D"),say("aytTarih1Y")).toFixed(2);

    document.getElementById("aytCografya1N").innerText=
        net(say("aytCografya1D"),say("aytCografya1Y")).toFixed(2);

    document.getElementById("tytSonuc").innerText=
        "🎯 TYT Net: "+tyt.toFixed(2);

    document.getElementById("saySonuc").innerText=
        "🔢 AYT Sayısal Net: "+sayisal.toFixed(2);

    document.getElementById("eaSonuc").innerText=
        "📚 AYT EA Net: "+ea.toFixed(2);

    document.getElementById("sonuc").style.display="block";
}

function ara(){

    const kelime=
        document.getElementById("arama").value
        .toLocaleLowerCase("tr-TR")
        .trim();

    const liste=document.getElementById("programListesi");

    const veriler=window.programVerileri || [];

    const sonuc=veriler.filter(p=>
        p.universite.toLocaleLowerCase("tr-TR").includes(kelime) ||
        p.bolum.toLocaleLowerCase("tr-TR").includes(kelime)
    );

    if(sonuc.length===0){

        liste.innerHTML=
        '<div class="kart">❌ Uygun program bulunamadı.</div>';

        return;
    }

    liste.innerHTML=sonuc.map(p=>`

        <div class="kart">

            <h3>🎓 ${p.bolum}</h3>

            <p>🏫 ${p.universite}</p>

            <p>📍 ${p.sehir}</p>

            <p>📊 Puan Türü: ${p.puan}</p>

            <p>🏛️ Üniversite Türü: ${p.tur}</p>

            <p>📚 Öğretim: ${p.ogretim}</p>

            <p>📈 2025 Sıralama:
            ${p.siralama2025 ?? "Veri yok"}</p>

        </div>

    `).join("");
}

</script>

</body>
</html>
