<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetMatik - YKS Hesaplama</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

header {
    background: #3157d5;
    color: white;
    text-align: center;
    padding: 30px 20px;
}

header h1 {
    font-size: 38px;
    margin-bottom: 8px;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
}

.section {
    background: white;
    padding: 25px;
    border-radius: 18px;
    margin-bottom: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.section h2 {
    color: #3157d5;
    margin-bottom: 20px;
}

.subject {
    display: grid;
    grid-template-columns: 1fr 100px 100px 100px;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
}

.subject input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    text-align: center;
}

.net {
    font-weight: bold;
    text-align: center;
    color: #3157d5;
}

button {
    background: #3157d5;
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #2443aa;
}

.result {
    display: none;
    background: #eaf0ff;
    padding: 25px;
    border-radius: 15px;
    margin-top: 20px;
    text-align: center;
}

.result h2 {
    color: #3157d5;
    margin-bottom: 10px;
}

@media (max-width: 650px) {
    .subject {
        grid-template-columns: 1fr 70px 70px 70px;
    }

    .subject input {
        padding: 8px 3px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎓 NetMatik</h1>
    <p>YKS Net Hesaplama Merkezi</p>
</header>

<div class="container">

    <div class="section">
        <h2>🎯 TYT</h2>

        <div class="subject">
            <strong>Ders</strong>
            <strong>Doğru</strong>
            <strong>Yanlış</strong>
            <strong>Net</strong>
        </div>

        <div class="subject">
            <span>Türkçe</span>
            <input type="number" id="tytTurkceD" min="0">
            <input type="number" id="tytTurkceY" min="0">
            <span class="net" id="tytTurkceN">0</span>
        </div>

        <div class="subject">
            <span>Matematik</span>
            <input type="number" id="tytMatD" min="0">
            <input type="number" id="tytMatY" min="0">
            <span class="net" id="tytMatN">0</span>
        </div>

        <div class="subject">
            <span>Sosyal Bilimler</span>
            <input type="number" id="tytSosyalD" min="0">
            <input type="number" id="tytSosyalY" min="0">
            <span class="net" id="tytSosyalN">0</span>
        </div>

        <div class="subject">
            <span>Fen Bilimleri</span>
            <input type="number" id="tytFenD" min="0">
            <input type="number" id="tytFenY" min="0">
            <span class="net" id="tytFenN">0</span>
        </div>
    </div>

    <div class="section">
        <h2>📚 AYT</h2>

        <div class="subject">
            <strong>Ders</strong>
            <strong>Doğru</strong>
            <strong>Yanlış</strong>
            <strong>Net</strong>
        </div>

        <div class="subject">
            <span>Matematik</span>
            <input type="number" id="aytMatD" min="0">
            <input type="number" id="aytMatY" min="0">
            <span class="net" id="aytMatN">0</span>
        </div>

        <div class="subject">
            <span>Edebiyat-Sosyal 1</span>
            <input type="number" id="aytEdebD" min="0">
            <input type="number" id="aytEdebY" min="0">
            <span class="net" id="aytEdebN">0</span>
        </div>

        <div class="subject">
            <span>Fen Bilimleri</span>
            <input type="number" id="aytFenD" min="0">
            <input type="number" id="aytFenY" min="0">
            <span class="net" id="aytFenN">0</span>
        </div>

        <div class="subject">
            <span>Sosyal Bilimler 2</span>
            <input type="number" id="aytSosyalD" min="0">
            <input type="number" id="aytSosyalY" min="0">
            <span class="net" id="aytSosyalN">0</span>
        </div>
    </div>

    <div style="text-align:center;">
        <button onclick="hesapla()">🧮 Netlerimi Hesapla</button>
    </div>

    <div class="result" id="sonuc">
        <h2>🎉 Sonuçların</h2>
        <p id="tytSonuc"></p>
        <p id="aytSonuc"></p>
        <p><strong>Not:</strong> Net hesabı 4 yanlış = 1 doğru şeklindedir.</p>
    </div>

</div>

<script>
function netHesapla(d, y) {
    d = Number(d) || 0;
    y = Number(y) || 0;
    return d - (y / 4);
}

function hesapla() {

    let tytTurkce = netHesapla(
        document.getElementById("tytTurkceD").value,
        document.getElementById("tytTurkceY").value
    );

    let tytMat = netHesapla(
        document.getElementById("tytMatD").value,
        document.getElementById("tytMatY").value
    );

    let tytSosyal = netHesapla(
        document.getElementById("tytSosyalD").value,
        document.getElementById("tytSosyalY").value
    );

    let tytFen = netHesapla(
        document.getElementById("tytFenD").value,
        document.getElementById("tytFenY").value
    );

    let aytMat = netHesapla(
        document.getElementById("aytMatD").value,
        document.getElementById("aytMatY").value
    );

    let aytEdeb = netHesapla(
        document.getElementById("aytEdebD").value,
        document.getElementById("aytEdebY").value
    );

    let aytFen = netHesapla(
        document.getElementById("aytFenD").value,
        document.getElementById("aytFenY").value
    );

    let aytSosyal = netHesapla(
        document.getElementById("aytSosyalD").value,
        document.getElementById("aytSosyalY").value
    );

    document.getElementById("tytTurkceN").textContent = tytTurkce.toFixed(2);
    document.getElementById("tytMatN").textContent = tytMat.toFixed(2);
    document.getElementById("tytSosyalN").textContent = tytSosyal.toFixed(2);
    document.getElementById("tytFenN").textContent = tytFen.toFixed(2);

    document.getElementById("aytMatN").textContent = aytMat.toFixed(2);
    document.getElementById("aytEdebN").textContent = aytEdeb.toFixed(2);
    document.getElementById("aytFenN").textContent = aytFen.toFixed(2);
    document.getElementById("aytSosyalN").textContent = aytSosyal.toFixed(2);

    let toplamTyt = tytTurkce + tytMat + tytSosyal + tytFen;
    let toplamAyt = aytMat + aytEdeb + aytFen + aytSosyal;

    document.getElementById("tytSonuc").textContent =
        "TYT Toplam Net: " + toplamTyt.toFixed(2);

    document.getElementById("aytSonuc").textContent =
        "AYT Toplam Net: " + toplamAyt.toFixed(2);

    document.getElementById("sonuc").style.display = "block";
}
</script>

</body>
</html>
